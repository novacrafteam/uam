<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UAM — Ukraine Analytic Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b2a4a'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='900' font-size='24' text-anchor='middle' fill='%23ffd500'%3EUAM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --card:#fff; --ink:#111; --muted:#666; --line:#d6d6d6; --accent:#111; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe3e6; }
  .leaflet-container { font: inherit; }

  /* Емблема — лівий верхній кут */
  #logo { position: absolute; top: 10px; left: 10px; z-index: 1000; background: #fff; border-radius: 10px;
          padding: 6px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.3); line-height: 0; }
  #logo img { width: 112px; height: auto; display: block; }

  /* Нижня панель: вимірювання, пошук, статус */
  :root { --dock-h: 190px; }
  #dock { position: absolute; left: 8px; right: 8px; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); z-index: 1000;
          display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #dock > * { pointer-events: auto; width: 100%; max-width: 720px; }
  #tools { display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #tools > * { pointer-events: auto; }
  #readout { background: var(--accent); color: #fff; border-radius: 12px; padding: 8px 14px; font-size: 15px; line-height: 1.4;
             box-shadow: 0 2px 10px rgba(0,0,0,.3); text-align: center; display: none; width: 100%; }
  #readout b { font-size: 18px; }
  #bar { display: flex; gap: 8px; background: var(--card); padding: 6px; border-radius: 14px; width: auto !important;
         box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  #bar button { width: 76px; height: 54px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); background: #fff;
                border-radius: 10px; cursor: pointer; touch-action: manipulation; padding: 0; }
  #bar button img { height: 34px; width: 34px; object-fit: contain; display: block; pointer-events: none; }
  #bar button:hover { background: #f1f1f1; }
  #bar button.on { background: #dbe9fb; border-color: #0057b8; }
  #bar button svg { width: 32px; height: 32px; display: block; pointer-events: none; }
  .measuring #map, .drawing #map { cursor: crosshair; }
  body.drawing .leaflet-container { touch-action: none !important; }

  /* Панель малювання (відкривається олівцем) */
  #pen { display: none; background: var(--card); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.35); padding: 8px; }
  #dock > #pen { max-width: 440px; }
  #pen.open { display: block; }
  body.pen-on #dock > #search { display: none; }
  #pen .prow { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  #pen .prow + .prow { margin-top: 8px; }
  #pen .tools button { flex: 1; height: 48px; border: 2px solid var(--line); background: #fff; border-radius: 10px; cursor: pointer; color: var(--ink); padding: 0; touch-action: manipulation; }
  #pen .tools button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #pen .tools button.on { background: #dbe9fb; border-color: #0057b8; }
  #pen .colors { display: none; flex-wrap: wrap; justify-content: center; gap: 6px; }
  #pen .colors.open { display: flex; }
  #pen .colors button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #bbb; cursor: pointer; padding: 0; touch-action: manipulation; }
  #pen .colors button.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0057b8; }
  #pen .colors .custom { position: relative; width: 32px; height: 32px; border-radius: 50%; border: 2px dashed #888; display: flex; align-items: center; justify-content: center;
                         font-size: 20px; line-height: 1; color: #555; cursor: pointer; overflow: hidden; }
  #pen .colors .custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  #pen .pal button, #pen .hist button { height: 42px; border: 2px solid var(--line); background: #fff; border-radius: 10px; cursor: pointer; font: inherit; font-size: 14px; color: var(--ink); padding: 0 10px; touch-action: manipulation; }
  #pen .pal #pPal { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #pen .pal #pPal svg, #pen .hist svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #pen #palDot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #888; background: #e03131; display: block; }
  #pen .pal button[data-w] { width: 46px; display: flex; align-items: center; justify-content: center; padding: 0; }
  #pen .pal button[data-w] i { display: block; width: 24px; background: #111; border-radius: 4px; }
  #pen .pal button[data-w].on, #pen .pal #pPal.on { background: #dbe9fb; border-color: #0057b8; }
  #pen .hist button { flex: 1; }
  #pen .hist button:disabled { opacity: .35; cursor: default; }
  #pen .misc button { height: 42px; border: 2px solid var(--line); background: #fff; border-radius: 10px; cursor: pointer; font: inherit; font-size: 14px; color: var(--ink); padding: 0 10px; touch-action: manipulation; }
  #pen .misc button[data-w] { width: 46px; display: flex; align-items: center; justify-content: center; padding: 0; }
  #pen .misc button[data-w] i { display: block; width: 24px; background: #111; border-radius: 4px; }
  #pen .misc button[data-w].on { background: #dbe9fb; border-color: #0057b8; }
  #pen .misc #pUndo, #pen .misc #pClear { flex: 1; }
  @media (max-width: 400px) { #bar button { width: 64px; } }

  #status { text-align: center; font-size: 11px; color: #222; background: rgba(255,255,255,.88); border-radius: 8px; padding: 3px 10px; width: auto !important; }
  #status button { all: unset; cursor: pointer; text-decoration: underline; margin-left: 6px; }

  /* Елементи керування Leaflet — над нижньою панеллю: шари зліва, масштаб +/- справа */
  .leaflet-bottom { bottom: var(--bar-bottom, 120px); }
  #attr { position: absolute; right: 0; bottom: calc(2px + env(safe-area-inset-bottom, 0px)); z-index: 900; font-size: 10px; line-height: 12px; color: #333;
          background: rgba(255,255,255,.78); padding: 1px 6px; border-radius: 6px 0 0 0; max-width: 100%; text-align: right; }
  #attr a { color: #0b61a4; text-decoration: none; }
  .leaflet-top.leaflet-left { margin-top: 78px; }
  .leaflet-control-zoom a { width: 46px; height: 46px; line-height: 46px; font-size: 24px; }
  .leaflet-control-layers-toggle { width: 46px; height: 46px; }
  .leaflet-control-layers-expanded { max-height: 45vh; overflow-y: auto; }
  @media (max-width: 600px) {
    #logo img { width: 84px; }
  }
  .popup h4 { margin: 0 0 4px; font-size: 15px; }
  .popup div { font-size: 13px; line-height: 1.4; word-break: break-word; }
  .popup .k { color: var(--muted); }
  .vtx { cursor: crosshair; }
  /* Пошук (великий, внизу) */
  #search { position: relative; }
  #sbox { display: flex; align-items: stretch; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.35); overflow: hidden; min-height: 58px; }
  #q { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0 14px; font: inherit; font-size: 17px; color: var(--ink); background: transparent; }
  #q::placeholder { color: #777; }
  #sbox button { border: 0; background: transparent; padding: 0 18px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; color: var(--ink); touch-action: manipulation; }
  #sbox button:hover { background: #f1f1f1; }
  #sgo { background: #111 !important; color: #fff !important; }
  #sx { color: var(--muted); font-size: 26px; font-weight: 400 !important; padding: 0 12px !important; display: none; }
  #res { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.35);
         max-height: 50vh; overflow-y: auto; display: none; }
  #res .hd { padding: 7px 14px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: #f6f6f6; }
  #res .it { padding: 13px 14px; font-size: 16px; line-height: 1.3; cursor: pointer; border-top: 1px solid #eee; word-break: break-word; }
  #res .it:hover, #res .it.sel { background: #f1f1f1; }
  #res .it small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  #res .msg { padding: 13px 14px; font-size: 14px; color: var(--muted); }
  /* Верхня права панель: календар змін + мова */
  #tr { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 8px; align-items: flex-start; }
  #tr > div { position: static; }
  #calBtn, #langBtn { width: 56px; height: 56px; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.3); cursor: pointer;
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; touch-action: manipulation; color: var(--ink); }
  #calBtn span, #langBtn span { font-size: 11px; font-weight: 700; letter-spacing: .03em; }
  .step { width: 42px; height: 56px; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.3); cursor: pointer;
          font-size: 30px; line-height: 1; color: var(--ink); padding: 0 0 4px; touch-action: manipulation; }
  .step:disabled { opacity: .35; cursor: default; }
  body.archive #calBtn { background: #0057b8; color: #fff; }
  body.archive #calBtn svg { stroke: #fff; }
  body.archive #map { outline: 4px solid #0057b8; outline-offset: -4px; }
  #langMenu { display: none; position: absolute; top: 64px; right: 0; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.35); overflow: hidden; min-width: 170px; }
  #langMenu.open { display: block; }
  #langMenu button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; border: 0; background: #fff; padding: 14px 16px;
                     font: inherit; font-size: 16px; color: var(--ink); cursor: pointer; text-align: left; touch-action: manipulation; }
  #langMenu button + button { border-top: 1px solid #eee; }
  #langMenu button:hover { background: #f1f1f1; }
  #langMenu button.act { font-weight: 700; }
  #langMenu button.act::after { content: "✓"; }
  #calPanel { display: none; position: absolute; top: 64px; right: 0; width: min(340px, calc(100vw - 20px)); background: #fff; border-radius: 14px;
              box-shadow: 0 2px 14px rgba(0,0,0,.4); padding: 12px; color: var(--ink); }
  #calPanel.open { display: block; }
  #calPanel .ch { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #calPanel .ch b { font-size: 16px; }
  #calPanel .ch button { width: 44px; height: 40px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-size: 20px; cursor: pointer; }
  #calPanel .cq { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  #calPanel .cq button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 6px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  #calPanel .cq button:hover, #calPanel .ch button:hover { background: #f1f1f1; }
  #calPanel .cg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  #calPanel .cg .w { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0 4px; text-transform: uppercase; }
  #calPanel .cg .d { position: relative; height: 40px; border: 0; background: #f4f4f4; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); padding: 0; }
  #calPanel .cg .d.dis { background: transparent; color: #bbb; cursor: default; }
  #calPanel .cg .d.sel { background: #0057b8; color: #fff; font-weight: 700; }
  #calPanel .cg .d.has::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #0057b8; }
  #calPanel .cg .d.sel.has::after { background: #fff; }
  #calPanel .cn { margin-top: 10px; font-size: 13px; color: #5c4400; background: #fff3cd; border-radius: 8px; padding: 8px 10px; display: none; }
  #calPanel .cl { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .pin { width: 18px; height: 18px; border-radius: 50%; background: #e03131; border: 3px solid #fff; box-shadow: 0 0 0 2px #e03131, 0 2px 6px rgba(0,0,0,.5); }

  #tilewarn { display: none; position: absolute; top: 64px; left: 50%; transform: translateX(-50%); z-index: 1100; width: min(92%, 460px);
              background: #fff3cd; color: #5c4400; border: 1px solid #e6c65c; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.4;
              box-shadow: 0 2px 10px rgba(0,0,0,.3); }

  /* ======== Адаптація: безпечні зони, висота панелей ======== */
  #logo { left: calc(10px + env(safe-area-inset-left, 0px)); }
  #tr { right: calc(10px + env(safe-area-inset-right, 0px)); }
  #calPanel { max-height: calc(100vh - 80px); overflow-y: auto; }

  /* ======== Альбомна орієнтація та комп'ютер: бічна панель інструментів, пошук угорі ======== */
  @media (min-width: 640px) and (orientation: landscape), (min-width: 900px) {
    #dock { top: 0; left: 0; right: 0; bottom: 0; display: block; }
    #dock > #search { position: absolute; top: 10px; left: calc(150px + env(safe-area-inset-left, 0px)); width: min(480px, calc(100vw - 460px)); max-width: none; }
    #sbox { min-height: 46px; border-radius: 12px; }
    #q { font-size: 16px; }
    #sbox button { font-size: 15px; padding: 0 16px; }
    #sx { font-size: 22px; }
    #res { bottom: auto; top: calc(100% + 8px); max-height: calc(100vh - 90px); }
    #res .it { padding: 10px 14px; font-size: 15px; }
    #dock > #tools { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); top: 86px; width: auto; max-width: none;
                     flex-direction: row; align-items: flex-start; gap: 10px; }
    #bar { flex-direction: column; order: 1; }
    #bar button { width: 60px; height: 54px; }
    #tools #pen { order: 2; width: 330px; }
    #readout { position: fixed; top: 66px; left: 50%; transform: translateX(-50%); width: auto; max-width: 70vw; white-space: nowrap; }
    #dock > #status { position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; }
    .leaflet-bottom { bottom: 30px; }
    .leaflet-top.leaflet-left { margin-top: 0; top: auto; bottom: 30px; left: 62px; }
  }

  /* Альбомна орієнтація на телефоні (невисокий екран): усе компактніше */
  @media (min-width: 640px) and (orientation: landscape) and (max-height: 520px) {
    #logo { padding: 4px 6px; }
    #logo img { width: 78px; }
    #dock > #search { left: calc(108px + env(safe-area-inset-left, 0px)); width: min(440px, calc(100vw - 360px)); }
    #sbox { min-height: 40px; }
    #q { font-size: 15px; }
    #dock > #tools { top: 62px; gap: 8px; }
    #bar { gap: 6px; padding: 5px; }
    #bar button { width: 50px; height: 44px; }
    #bar button img, #bar button svg { width: 27px; height: 27px; height: 27px; }
    #tools #pen { width: 290px; padding: 6px; }
    #pen .tools button { height: 40px; }
    #pen .colors button { width: 30px; height: 30px; }
    #pen .misc button { height: 36px; }
    #pen .prow + .prow { margin-top: 6px; }
    #calBtn, #langBtn { width: 46px; height: 46px; }
    .step { width: 34px; height: 46px; font-size: 26px; }
    #calBtn svg, #langBtn svg { width: 20px; height: 20px; }
    #langMenu, #calPanel { top: 54px; }
    #langMenu button { padding: 10px 14px; font-size: 15px; }
    .leaflet-control-zoom a { width: 38px; height: 38px; line-height: 38px; font-size: 20px; }
    .leaflet-control-layers-toggle { width: 40px; height: 40px; }
    #dock > #status { bottom: 20px; }
  }

  /* Повний екран: лишаються лише емблема, календар (з датою та стрілками) і кнопка виходу */
  #fsBtn { width: 44px; height: 44px; border: 0; border-radius: 10px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.3); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  #fsBtn svg { width: 24px; height: 24px; fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  body.full #dock, body.full #lang, body.full #tilewarn,
  body.full .leaflet-control-zoom, body.full .leaflet-control-layers, body.full .leaflet-control-scale { display: none !important; }
  body.full #fsBtn { opacity: .55; }
  body.full .leaflet-bottom { bottom: calc(24px + env(safe-area-inset-bottom, 0px)) !important; }

  /* ======== UAM 2.0: темний «штабний» інтерфейс ======== */
  :root { --ink:#e8eef6; --muted:#8fa3b8; --line:#26405c; --accent:#ffd500; --p1:rgba(10,22,38,.86); --p2:#12263d; --yel:#ffd500; --blu:#2f80ed; }
  body { background:#07111d; }
  #boot { position:fixed; inset:0; z-index:5000; background:radial-gradient(circle at 50% 40%,#0f2a4a,#050c15); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:#fff; transition:opacity .45s; }
  #boot.done { opacity:0; pointer-events:none; }
  #boot b { font-size:44px; letter-spacing:.18em; color:var(--yel); margin-top:18px; }
  #boot span { font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:#9db4cc; }
  #boot .spin { width:54px; height:54px; border-radius:50%; border:4px solid #1d3a5c; border-top-color:var(--yel); animation:uspin .9s linear infinite; }
  @keyframes uspin { to { transform:rotate(360deg); } }
  #logo, #bar, #pen, #sbox, #calBtn, #langBtn, .step, #fsBtn, #langMenu, #calPanel, #res, #status {
    background:var(--p1); color:var(--ink); border:1px solid #2b4a6b; border-radius:14px;
    -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4);
    box-shadow:0 8px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
  }
  #logo { background:#fff; border-color:var(--yel); border-width:2px; }
  #bar { padding:7px; gap:7px; }
  #bar button, #pen .tools button, #pen .pal button, #pen .misc button, #pen .hist button, #calPanel .cq button, #calPanel .ch button, #langMenu button {
    background:var(--p2); color:var(--ink); border:1px solid #2b4a6b; border-radius:11px; transition:all .15s;
  }
  #bar button img { filter:invert(1) brightness(1.15); }
  #bar button:hover, #pen button:hover, #calPanel .cq button:hover, #calPanel .ch button:hover, #langMenu button:hover { background:#1b3a5e; border-color:var(--yel); }
  #bar button:active, #pen button:active { transform:scale(.94); }
  #bar button.on, #pen .tools button.on, #pen .pal button.on, #pen .pal #pPal.on, #pen .misc button.on { background:var(--yel); border-color:var(--yel); color:#07111d; }
  #bar button.on img { filter:none; }
  #pen .pal button[data-w] i, #pen .misc button[data-w] i { background:var(--ink); }
  #pen .pal button.on i, #pen .misc button.on i { background:#07111d; }
  #calBtn svg, #langBtn svg { stroke:var(--yel) !important; }
  #calBtn span, #langBtn span { color:var(--ink); }
  .step { color:var(--yel); }
  #q { color:var(--ink); } #q::placeholder { color:#6f86a0; }
  #sbox button { color:var(--ink); } #sbox button:hover { background:#1b3a5e; }
  #sgo { background:var(--yel) !important; color:#07111d !important; }
  #res .hd { background:#0d1e33; color:var(--yel); }
  #res .it { border-top:1px solid #1d3550; } #res .it:hover, #res .it.sel { background:#1b3a5e; }
  #res .it small, #res .msg { color:var(--muted); }
  #readout { background:var(--yel); color:#07111d; border-radius:12px; font-weight:600; box-shadow:0 8px 30px rgba(0,0,0,.55); }
  #calPanel .cg .d { background:var(--p2); color:var(--ink); } #calPanel .cg .d.dis { background:transparent; color:#3d5670; }
  #calPanel .cg .d.sel { background:var(--yel); color:#07111d; } #calPanel .cg .d.has::after { background:var(--yel); }
  #calPanel .cg .d.sel.has::after { background:#07111d; }
  #calPanel .cg .w, #calPanel .cl { color:var(--muted); }
  body.archive #calBtn { background:var(--yel); } body.archive #calBtn span { color:#07111d; } body.archive #calBtn svg { stroke:#07111d !important; }
  body.archive #map { outline:4px solid var(--yel); outline-offset:-4px; }
  #status { border-radius:999px; padding:5px 16px; font-size:12px; color:var(--ink); } #status button { color:var(--yel); }
  #attr { background:rgba(7,17,29,.8); color:#9db4cc; } #attr a { color:var(--yel); }
  .leaflet-control-zoom, .leaflet-control-layers { background:var(--p1) !important; border:1px solid #2b4a6b !important; border-radius:14px !important; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.55) !important; }

/* Іконки: беремо з збереженої копії за кодом стилю (код+колір), бо Google у «живих» даних
   віддає однакові сірі значки. Для нових типів значків малюємо кружечок потрібного кольору. */
const ICON_BY_KEY = {};
function learnIcons(groups) {
  groups.forEach(g => g.items.forEach(p => { if (p.key && p.st.icon && ICONS[p.st.icon]) ICON_BY_KEY[p.key] = ICONS[p.st.icon]; }));
}
function iconFor(p) {
  const known = ICON_BY_KEY[p.key];
  if (known) return L.icon({ iconUrl: known, iconSize: [26, 26], iconAnchor: [13, 13] });
  const hex = /-([0-9A-Fa-f]{6})$/.exec(p.key);
  if (hex) return L.divIcon({ className: "", iconSize: [16, 16], iconAnchor: [8, 8],
    html: '<div style="width:16px;height:16px;border-radius:50%;background:#' + hex[1] + ';border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.6)"></div>' });
  const href = p.st.icon ? (ICONS[p.st.icon] || p.st.icon) : "";
  return href ? L.icon({ iconUrl: href, iconSize: [26, 26], iconAnchor: [13, 13] }) : new L.Icon.Default();
}

function buildLayer(p) {
  const out = [];
  const bind = (lyr, p) => lyr.on("click", e => {
    if (busy()) return;
    if (!p.name && !p.info.length && !p.desc) return;
    L.popup({ maxWidth: 300 }).setLatLng(e.latlng).setContent(popupHtml(p)).openOn(map);
  });
  p.geoms.forEach(g => {
    let lyr;
    if (g.t === "pt") {
      lyr = L.marker(g.c, { icon: iconFor(p), bubblingMouseEvents: true });
    } else if (g.t === "ln") {
      const l = p.st.line || {}, c = l.c || { color: "#3388ff", opacity: 1 };
      lyr = L.polyline(g.c, { color: c.color, opacity: c.opacity, weight: Math.max(1.5, l.w || 1.5) });
    } else {
      const l = p.st.line || {}, pl = p.st.poly || {};
      const lc = l.c || { color: "#3388ff", opacity: 1 }, fc = pl.c || lc;
      lyr = L.polygon(g.c, {
        stroke: (l.w || 0) >= 0.5, color: lc.color, opacity: lc.opacity, weight: Math.max(1, l.w || 1),
        fill: pl.fill !== false, fillColor: fc.color, fillOpacity: fc.opacity
      });
    }
    bind(lyr, p); out.push(lyr);
  });
  return out;
}

function render(groups) {
  const seen = new Set();
  groups.forEach(gr => {
    seen.add(gr.name);
    let fg = folderLayers.get(gr.name);
    if (!fg) {
      fg = L.featureGroup();
      folderLayers.set(gr.name, fg);
      layersCtl.addOverlay(fg, esc(folderLabel(gr.name)));
      fg.on("add", () => hiddenByUser.delete(gr.name));
      fg.on("remove", () => hiddenByUser.add(gr.name));
      const on = DEFAULT_ON.some(k => gr.name.toLowerCase().includes(k));
      if (!on && firstRender) hiddenByUser.add(gr.name);
      if (!hiddenByUser.has(gr.name)) fg.addTo(map);
    }
    const wasOn = map.hasLayer(fg);
    fg.clearLayers();
    const entries = [];
    gr.items.forEach(p => { buildLayer(p).forEach(l => fg.addLayer(l)); const e = entryOf(p, gr.name); if (e) entries.push(e); });
    searchIdx.set(gr.name, entries);
    if (wasOn && !map.hasLayer(fg)) fg.addTo(map);
  });
  folderLayers.forEach((fg, name) => { if (!seen.has(name)) { map.removeLayer(fg); layersCtl.removeLayer(fg); folderLayers.delete(name); searchIdx.delete(name); } });
  firstRender = false;
}

function snapshotText() {
  return new TextDecoder().decode(Uint8Array.from(atob(SNAPSHOT_B64), c => c.charCodeAt(0)));

async function fetchLive() {
  if (!MAP_ID) return null;
  const u = "https://www.google.com/maps/d/kml?mid=" + encodeURIComponent(MAP_ID) + "&forcekml=1&_=" + Date.now();
  const one = async url => {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
    try { const r = await fetch(url, { cache: "no-store", signal: ctl.signal }); if (!r.ok) throw new Error(r.status);
          const x = await r.text(); if (!x.includes("<kml")) throw new Error("no kml"); return x; } finally { clearTimeout(to); }
  };
  try { return await Promise.any([u, "https://corsproxy.io/?url=" + encodeURIComponent(u), "https://api.allorigins.win/raw?url=" + encodeURIComponent(u)].map(one)); } catch (e) { /* усі шляхи не відповіли */ }
  try {   // запасний шлях: копія з репозиторію, але ТІЛЬКИ якщо вона збережена саме з цієї карти
    const ij = await (await fetch(HISTORY_DIR + "index.json", { cache: "no-store" })).json();
    if (ij.mid === MAP_ID) {
      const r = await fetch(HISTORY_DIR + "latest.kml.gz", { cache: "no-store" });
      if (r.ok) { const x = await gunzip(await r.arrayBuffer()); if (x.includes("<kml")) return x; }
    }
  } catch (e) { /* немає архіву */ }
  return null;
}
let lastSig = "";
async function refresh(manual) {

    const sig = live.length + ":" + live.slice(-200);
    if (sig !== lastSig || manual) { try { const g = parseKml(live); liveGroups = g; if (!viewDate) render(g); lastSig = sig; } catch (e) { console.error(e); } }
    setSt("st_ok", hhmm()); hideBoot();
  } else if (MAP_ID) {

}

/* ---------- вимірювання ---------- */
let mode = null, finished = false, pts = [];
const mLayer = L.layerGroup().addTo(map);
const readout = document.getElementById("readout");
const $ = id => document.getElementById(id);

const fmtLen = m => m < 1000 ? Math.round(m) + " " + T("m") : (m / 1000).toFixed(m < 10000 ? 2 : 1) + " " + T("km");
const fmtArea = m2 => {
  const km2 = m2 / 1e6, ha = m2 / 1e4;
  if (m2 < 1e4) return Math.round(m2) + " " + T("m2");
  if (km2 < 1) return ha.toFixed(1) + " " + T("ha");
  return km2.toFixed(km2 < 100 ? 2 : 1) + " " + T("km2") + " (" + Math.round(ha).toLocaleString(I18N[LANG].locale) + " " + T("ha") + ")";
};
const rad = d => d * Math.PI / 180;
function ringArea(ll) {
  const R = 6378137, n = ll.length; let t = 0;
  for (let i = 0; i < n; i++) { const a = ll[i], b = ll[(i + 1) % n]; t += rad(b.lng - a.lng) * (2 + Math.sin(rad(a.lat)) + Math.sin(rad(b.lat))); }
  return Math.abs(t * R * R / 2);
}
const pathLen = (ll, closed) => { let s = 0; for (let i = 1; i < ll.length; i++) s += ll[i - 1].distanceTo(ll[i]); if (closed && ll.length > 2) s += ll[ll.length - 1].distanceTo(ll[0]); return s; };

function drawMeasure() {
  mLayer.clearLayers();
  const col = "#0057b8";
  if (mode === "line" && pts.length > 1) L.polyline(pts, { color: col, weight: 3, dashArray: "6 6", interactive: false }).addTo(mLayer);
  if (mode === "area" && pts.length > 2) L.polygon(pts, { color: col, weight: 3, fillColor: col, fillOpacity: .2, interactive: false }).addTo(mLayer);
  else if (mode === "area" && pts.length === 2) L.polyline(pts, { color: col, weight: 3, interactive: false }).addTo(mLayer);
  pts.forEach(p => L.circleMarker(p, { radius: 5, color: col, weight: 2, fillColor: "#fff", fillOpacity: 1, interactive: false }).addTo(mLayer));
  if (mode === "line") for (let i = 1; i < pts.length; i++) {
    L.tooltip({ permanent: true, direction: "center", className: "seg", opacity: .9 }).setLatLng(L.latLngBounds(pts[i - 1], pts[i]).getCenter()).setContent(fmtLen(pts[i - 1].distanceTo(pts[i]))).addTo(mLayer);
  }
  let h = "";
  if (!mode) h = "";
  else if (!pts.length) h = mode === "line" ? T("hint_line") : T("hint_area");
  else if (mode === "line") h = T("len") + ": <b>" + fmtLen(pathLen(pts)) + "</b> · " + T("pts") + ": " + pts.length;
  else if (pts.length < 3) h = T("add_more", 3 - pts.length);
  else h = T("area_l") + ": <b>" + fmtArea(ringArea(pts)) + "</b><br>" + T("perim") + ": " + fmtLen(pathLen(pts, true));
  readout.innerHTML = h; readout.style.display = h ? "block" : "none";
}
/* Перше натискання — вмикає малювання, повторне натискання на ту саму кнопку — вимикає і прибирає виміри */

}
map.on("click", e => { if (!mode) return; pts.push(e.latlng); drawMeasure(); });

L.DomEvent.disableClickPropagation($("dock"));
function placeControls() {

/* ---------- малювання (олівець) ---------- */
let penOn = false, penTool = "free", penColor = "#e03131", penWidth = 4, cur = null;
const shapes = [];                                   // {t, c, w, p:[[lat,lng],…], r, layer}
const DRAW_KEY = "awm_draw_v1";
const redoStack = [];
map.createPane("draw"); map.getPane("draw").style.zIndex = 450;
const drawRenderer = L.canvas({ pane: "draw", padding: 0.5 });
const drawGroup = L.layerGroup().addTo(map);
const rd = ll => [+ll.lat.toFixed(6), +ll.lng.toFixed(6)];
function saveShapes() {
  try { localStorage.setItem(DRAW_KEY, JSON.stringify(shapes.map(({ t, c, w, p, r }) => ({ t, c, w, p, r })))); } catch (e) { /* без збереження */ }
}
function arrowParts(a, b) {
  const crs = L.CRS.EPSG3857, pa = crs.project(L.latLng(a)), pb = crs.project(L.latLng(b));
  const ang = Math.atan2(pb.y - pa.y, pb.x - pa.x), len = Math.hypot(pb.x - pa.x, pb.y - pa.y), head = len * 0.25, sp = 0.5;
  const wing = k => crs.unproject(L.point(pb.x - head * Math.cos(ang + k * sp), pb.y - head * Math.sin(ang + k * sp)));
  return [[a, b], [wing(-1), L.latLng(b), wing(1)]];
}
function makeShapeLayer(sh) {
  const o = { renderer: drawRenderer, color: sh.c, weight: sh.w, opacity: 1, lineCap: "round", lineJoin: "round", fillColor: sh.c, fillOpacity: 0.15 };
  let l;
  if (sh.t === "free") l = L.polyline(sh.p, Object.assign(o, { fill: false }));
  else if (sh.t === "rect") l = L.rectangle([sh.p[0], sh.p[1]], o);
  else if (sh.t === "circle") l = L.circle(sh.p[0], Object.assign(o, { radius: Math.max(sh.r, 1) }));
  else l = L.polyline(arrowParts(sh.p[0], sh.p[1]), Object.assign(o, { fill: false }));
  l.on("click", () => { if (penOn && penTool === "erase") removeShape(sh); });
  return l;
}
function removeShape(sh, toRedo) {
  const i = shapes.indexOf(sh); if (i < 0) return;
  shapes.splice(i, 1); drawGroup.removeLayer(sh.layer); saveShapes();
  if (toRedo) redoStack.push({ t: sh.t, c: sh.c, w: sh.w, p: sh.p, r: sh.r });
  updatePenBtns();
}
function updatePenBtns() { $("pUndo").disabled = !shapes.length; $("pRedo").disabled = !redoStack.length; }
function addShape(sh) { sh.layer = makeShapeLayer(sh); drawGroup.addLayer(sh.layer); shapes.push(sh); }
try {
  JSON.parse(localStorage.getItem(DRAW_KEY) || "[]").forEach(sh => { if (sh && sh.p && sh.p.length) addShape(sh); });
} catch (e) { /* немає збережених малюнків */ }

function dragState() {
  const drawing = penOn && penTool !== "erase";
  drawing ? map.dragging.disable() : map.dragging.enable();
  document.body.classList.toggle("drawing", drawing);
}
function setPen(on) {
  if (on && mode) setMode(mode);                      // вимикаємо вимірювання
  penOn = on; cancelCur();
  $("pen").classList.toggle("open", on); $("bPen").classList.toggle("on", on);
  document.body.classList.toggle("pen-on", on);
  if (on) { resEl.style.display = "none"; qEl.blur(); }
  if (on) map.closePopup();
  dragState(); placeControls();
}
function cancelCur() { if (cur) { if (cur.layer) drawGroup.removeLayer(cur.layer); cur = null; } }
function paintPenUi() {
  document.querySelectorAll("#pen [data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === penTool));
  document.querySelectorAll("#pen [data-color]").forEach(b => b.classList.toggle("on", b.dataset.color === penColor));
  document.querySelectorAll("#pen [data-w]").forEach(b => b.classList.toggle("on", +b.dataset.w === penWidth));
  $("palDot").style.background = penColor; $("pCustom").value = /^#[0-9a-f]{6}$/i.test(penColor) ? penColor : "#e03131";
}
$("bPen").onclick = () => setPen(!penOn);
document.querySelectorAll("#pen [data-tool]").forEach(b => b.onclick = () => { penTool = b.dataset.tool; paintPenUi(); dragState(); });
document.querySelectorAll("#pen [data-color]").forEach(b => b.onclick = () => { penColor = b.dataset.color; paintPenUi(); $("palRow").classList.remove("open"); $("pPal").classList.remove("on"); placeControls(); });
document.querySelectorAll("#pen [data-w]").forEach(b => b.onclick = () => { penWidth = +b.dataset.w; paintPenUi(); });
$("pUndo").onclick = () => { const sh = shapes[shapes.length - 1]; if (sh) removeShape(sh, true); };
$("pRedo").onclick = () => { const d = redoStack.pop(); if (d) { addShape(d); saveShapes(); updatePenBtns(); } };
$("pClear").onclick = () => { while (shapes.length) drawGroup.removeLayer(shapes.pop().layer); redoStack.length = 0; saveShapes(); updatePenBtns(); };
$("pPal").onclick = () => { $("palRow").classList.toggle("open"); $("pPal").classList.toggle("on", $("palRow").classList.contains("open")); placeControls(); };
$("pCustom").addEventListener("input", e => { penColor = e.target.value; paintPenUi(); });

/* Малювання пальцем / мишею по карті */
const mapEl = map.getContainer();
function refreshCur() {
  if (cur.t === "free") {
    if (!cur.layer && cur.p.length > 1) { cur.layer = makeShapeLayer(cur); drawGroup.addLayer(cur.layer); }
    else if (cur.layer) cur.layer.setLatLngs(cur.p);
  } else if (cur.p.length > 1) {
    if (cur.layer) drawGroup.removeLayer(cur.layer);
    cur.layer = makeShapeLayer(cur); drawGroup.addLayer(cur.layer);
  }
}
mapEl.addEventListener("pointerdown", e => {
  if (!penOn) return;
  if (!e.isPrimary) { cancelCur(); return; }          // другий палець — це масштабування, а не малювання
  if (penTool === "erase" || (e.pointerType === "mouse" && e.button !== 0)) return;
  if (e.target.closest(".leaflet-control, .leaflet-popup")) return;
  e.preventDefault();
  try { mapEl.setPointerCapture(e.pointerId); } catch (_) { /* не критично */ }
  const ll = map.mouseEventToLatLng(e);

});

  if (cur.t === "free") { if (pt.distanceTo(cur.last) < 3) return; cur.last = pt; cur.p.push(rd(ll)); }

function endDraw(e) {
  if (!cur) return;

  const big = c.t === "free" ? c.p.length > 1
    : c.p.length > 1 && map.latLngToContainerPoint(L.latLng(c.p[0])).distanceTo(map.latLngToContainerPoint(L.latLng(c.p[1]))) >= 6;
  if (!big) { if (c.layer) drawGroup.removeLayer(c.layer); return; }
  if (c.layer) drawGroup.removeLayer(c.layer);

}
mapEl.addEventListener("pointerup", endDraw);

/* ---------- пошук ---------- */
const qEl = $("q"), resEl = $("res"), sx = $("sx");
const pinLayer = L.layerGroup().addTo(map);
const boundaryLayer = L.layerGroup().addTo(map);
const clearMarks = () => { pinLayer.clearLayers(); boundaryLayer.clearLayers(); };

function parseLatLng(q) {
  q = q.trim().replace(/[–—−]/g, "-");
  if (/^-?\d+,\d+\s+-?\d+,\d+$/.test(q)) q = q.replace(/,/g, ".");
  const sign = h => (h === "S" || h === "W" ? -1 : 1);
  let vals = [];
  const dms = [...q.matchAll(/(\d+(?:\.\d+)?)\s*°\s*(?:(\d+(?:\.\d+)?)\s*['′’]\s*)?(?:(\d+(?:\.\d+)?)\s*(?:["″”]|'')\s*)?([NSEW])?/gi)];
  if (dms.length === 2) {
    vals = dms.map(m => { const h = (m[4] || "").toUpperCase(); return { v: sign(h) * (+m[1] + (+m[2] || 0) / 60 + (+m[3] || 0) / 3600), h }; });
  } else {
    const m = /^([NSEW])?\s*(-?\d+(?:\.\d+)?)\s*°?\s*([NSEW])?\s*[,;\s]\s*([NSEW])?\s*(-?\d+(?:\.\d+)?)\s*°?\s*([NSEW])?$/i.exec(q);
    if (!m) return null;
    const h1 = (m[1] || m[3] || "").toUpperCase(), h2 = (m[4] || m[6] || "").toUpperCase();
    vals = [{ v: sign(h1) * +m[2], h: h1 }, { v: sign(h2) * +m[5], h: h2 }];
  }
  let [a, b] = vals;
  if (a.h === "E" || a.h === "W" || b.h === "N" || b.h === "S") [a, b] = [b, a];
  let lat = a.v, lon = b.v;
  if (Math.abs(lat) > 90 && Math.abs(lon) <= 90) [lat, lon] = [lon, lat];
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { lat, lon };
}

function showPin(ll, html) {
  clearMarks();
  const m = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="pin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: !!html }).addTo(pinLayer);
  if (html) m.bindPopup(html, { maxWidth: 300 }).openPopup();
}
const fmtLL = ll => ll.lat.toFixed(5) + ", " + ll.lng.toFixed(5);

function goTo(item) {
  resEl.style.display = "none";
  if (item.kind === "coord") {
    const ll = L.latLng(item.lat, item.lon);
    map.setView(ll, Math.max(map.getZoom(), 12));
    showPin(ll, '<div class="popup"><h4>' + T("coords") + "</h4><div>" + fmtLL(ll) + "</div></div>");
  } else if (item.kind === "local") {
    const fg = folderLayers.get(item.folder);
    if (fg && !map.hasLayer(fg)) fg.addTo(map);
    if (item.bounds && item.bounds.isValid() && !item.bounds.getSouthWest().equals(item.bounds.getNorthEast())) map.fitBounds(item.bounds.pad(0.2), { maxZoom: 14 });
    else map.setView(item.ll, Math.max(map.getZoom(), 12));
    clearMarks();
    L.popup({ maxWidth: 300 }).setLatLng(item.ll).setContent(popupHtml(item.p)).openOn(map);
  } else {
    const ll = L.latLng(item.lat, item.lon);
    const popup = '<div class="popup"><h4>' + esc(item.title) + "</h4><div>" + esc(item.sub || "") + "</div><div>" + fmtLL(ll) + "</div></div>";
    let drawn = false;
    if (item.geo && /Polygon/.test(item.geo.type)) {
      try {
        showPin(ll, null);
        const gj = L.geoJSON(item.geo, { interactive: false, style: { color: "#ff3b30", weight: 3, fillColor: "#ff3b30", fillOpacity: .14 } }).addTo(boundaryLayer);
        map.fitBounds(gj.getBounds().pad(0.1), { maxZoom: 15 });
        L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="pin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(boundaryLayer).bindPopup(popup, { maxWidth: 300 }).openPopup();
        drawn = true;

  ["a", "а"], ["b", "б"], ["v", "в"], ["h", "г"], ["g", "г"], ["d", "д"], ["e", "е"], ["z", "з"], ["y", "и"], ["i", "і"], ["k", "к"], ["l", "л"], ["m", "м"],
  ["n", "н"], ["o", "о"], ["p", "п"], ["r", "р"], ["s", "с"], ["t", "т"], ["u", "у"], ["f", "ф"], ["c", "к"], ["w", "в"], ["x", "кс"], ["j", "й"], ["q", "к"]];

  }

async function geocode(q) {

  const common = t => "format=jsonv2&accept-language=" + encodeURIComponent(I18N[LANG].acceptLang) +
    "&addressdetails=1&namedetails=1&polygon_geojson=1&polygon_threshold=0.0004&limit=10&q=" + encodeURIComponent(t);
  const variant = hasCyr(q) ? ruToUk(q) : "";
  const hasVar = variant && variant.toLowerCase() !== q.toLowerCase();
  // Nominatim шукає за назвами будь-якою мовою (uk / ru / en), Photon — за початком назви
  const jobs = [nominatim(common(q) + "&featureType=settlement" + vb), photon(q), openMeteo(q)];
  if (hasVar) jobs.push(nominatim(common(variant) + "&featureType=settlement" + vb), photon(variant), openMeteo(variant));
  const res = await Promise.allSettled(jobs);
  const ok = r => r.status === "fulfilled" ? r.value : [];
  let nom = ok(res[0]).concat(hasVar ? ok(res[3]) : []);
  let pho = ok(res[1]).concat(hasVar ? ok(res[4]) : []);
  const geo = ok(res[2]).concat(hasVar ? ok(res[5]) : []);
  let failed = res.every(r => r.status === "rejected");
  if (nom.length + pho.length + geo.length < 3) {              // загальний пошук, якщо мало результатів

  }

  const push = (k, it) => { if (!seen.has(k)) { seen.add(k); items.push(it); } };
  nom.forEach(d => {
    const a = d.address || {}, nd = d.namedetails || {};
    const main = nd["name:" + LANG] || nd["name:uk"] || d.name || (d.display_name || "").split(", ")[0];
    const alts = ["uk", "ru", "en"].filter(l => l !== LANG).map(l => nd["name:" + l]).filter((x, i, arr) => x && x !== main && arr.indexOf(x) === i);
    push(d.osm_type + d.osm_id, {
      kind: "remote", lat: +d.lat, lon: +d.lon, bbox: d.boundingbox ? d.boundingbox.map(Number) : null, geo: d.geojson || null,
      title: main + (alts.length ? " (" + alts.join(" · ") + ")" : ""),

    });

    push((OSM_T[p.osm_type] || p.osm_type) + p.osm_id, {
      kind: "remote", lat: g[1], lon: g[0], geo: null,
      bbox: p.extent ? [p.extent[3], p.extent[1], p.extent[0], p.extent[2]] : null,
      title: p.name,
      sub: [typeName(p.osm_value), [p.county, p.state, p.country].filter(Boolean).join(", ")].filter(Boolean).join(" · ")
    });

    const ll = [g.latitude, g.longitude], nm = norm(g.name);

    if (items.some(it => norm(String(it.title).split(" (")[0]) === nm && distKm(ll, [it.lat, it.lon]) < 8)) return;

      title: g.name,

    });

}

  const q = qEl.value.trim();
  if (q) {
    searchToken++; remoteHtmlItems = []; remoteMsg = "";
    drawResults(q);
    if (q.length >= 3 && !parseLatLng(q)) remoteSearch(q);
  }
}
function setLang(l) {
  if (!I18N[l]) return;
  LANG = l;
  try { localStorage.setItem("awm_lang", l); } catch (e) { /* не зберігаємо */ }
  $("langMenu").classList.remove("open");
  applyLang();
}
$("langBtn").onclick = e => { e.stopPropagation(); $("calPanel").classList.remove("open"); $("langMenu").classList.toggle("open"); };
document.querySelectorAll("#langMenu button").forEach(b => { b.onclick = e => { e.stopPropagation(); setLang(b.dataset.l); }; });
map.on("click", closePanels);
applyLang();
loadIndex().then(() => { updateCalBtn(); renderCal(); });
</script>
